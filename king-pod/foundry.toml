[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["forge-std/=lib/forge-std/src/"]
skip = ["script/_broken/**"]
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read", path = "./zk" },
  { access = "read", path = "./zk/proofs" },
]
