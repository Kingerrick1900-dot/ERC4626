[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./" }]
# Missing sibling sources on some branches — exclude until landed.
skip = [
  "script/FireCnBuilds.s.sol",
  "test/CrownZkHardening.t.sol",
  "test/ZkReserves.t.sol",
]
